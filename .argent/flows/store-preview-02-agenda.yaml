executionPrerequisite: La demo és oberta a la vista Ara amb el filtre Totes.
steps:
  - tool: launch-app
    args: { bundleId: com.dsd.min }
  - wait: 500
  - tap: { text: Les meves }
  - await: { visible: { text: Qui ets? }, timeout: 15000 }
  - tap: { text: Laia Serra }
  - await: { visible: { text: Ara mateix }, timeout: 15000 }
  - await: { idle: true, stableFor: 400, timeout: 9000 }
  - wait: 1000
